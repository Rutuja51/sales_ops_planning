    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .calendar-header {
            background-color: #003366;
            color: white;
            padding: 15px 0;
            margin-bottom: 20px;
        }

        .time-slot {
            height: 60px;
            border: 1px solid #dee2e6;
            position: relative;
        }

        .time-label {
            background-color: #f8f9fa;
            font-weight: bold;
            text-align: center;
            padding: 5px;
        }

        .day-header {
            background-color: #003366;
            color: white;
            text-align: center;
            padding: 10px;
            font-weight: bold;
        }

        .available-slot {
            background-color: #ffffff;
            cursor: pointer;
            position: relative;
        }

        .available-slot:hover {
            background-color: #e9f7ef;
        }

        .available-flag {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 10px;
            height: 10px;
            background-color: #28a745;
            border-radius: 50%;
        }

        .booked-slot {
            background-color: #f8d7da;
            cursor: not-allowed;
            position: relative;
        }

        .slot-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            text-align: center;
        }

        .reschedule-btn {
            font-size: 0.7rem;
            padding: 2px 5px;
            margin-top: 3px;
        }

        .week-container {
            margin-bottom: 40px;
        }

        .week-header {
            background-color: #003366;
            color: white;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
        }

        .form-container {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 30px;
        }

        .modal-header {
            background-color: #003366;
            color: white;
        }

        .rescheduled-flag {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 10px;
            height: 10px;
            background-color: #fd7e14;
            border-radius: 50%;
        }

        .category-header {
            background-color: #003366;
            color: white;
            text-align: center;
            font-weight: bold;
        }

        .inbound-table {
            margin-bottom: 30px;
        }

        .outbound-table {
            margin-bottom: 50px;
        }

        .current-week {
            border: 2px solid #28a745;
            border-radius: 5px;
            padding: 5px;
        }

        /* Add these new styles */
        .schedule-tables-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .schedule-table {
            flex: 1;
            min-width: 0;
            /* Prevent flex items from overflowing */
        }

        /* Adjust the existing table styles */
        .inbound-table,
        .outbound-table {
            margin-bottom: 0;
            /* Remove the bottom margin since container handles it */
        }

        /* Add these new styles */
        .dual-tables {
            display: flex;
            gap: 20px;
            width: 100%;
        }

        .single-table {
            flex: 1;
            overflow-x: auto;
        }
        

        @media (max-width: 992px) {
            .dual-tables {
                flex-direction: column;
            }
        }

        /* Responsive behavior for smaller screens */
        @media (max-width: 992px) {
            .schedule-tables-container {
                flex-direction: column;
            }
        }
    </style>
</head>

    <!-- Reschedule Modal -->
    <div class="modal fade" id="rescheduleModal" tabindex="-1" aria-labelledby="rescheduleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="rescheduleModalLabel">Reschedule Event</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="original-date">
                    <input type="hidden" id="original-time">
                    <input type="hidden" id="original-category">

                    <div class="mb-3">
                    <label for="event-title" class="form-label">Order No *</label>
                    <input type="text" class="form-control" id="event-order-No-reschedule">
                    </div>

                    <div class="mb-3">
                        <label for="reschedule-date" class="form-label">Date</label>
                        <input type="date" class="form-control" id="reschedule-date" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="reschedule-time" class="form-label">Time</label>
                        <select class="form-select" id="reschedule-time" required>
                            <option value="">Select time</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="reschedule-category" class="form-label">Category</label>
                        <select class="form-select" id="reschedule-category" required>
                            <option value="inbound">Inbound</option>
                            <option value="outbound">Outbound</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="confirm-reschedule">Reschedule</button>
                </div>
            </div>
        </div>
    </div>
