        <div class="table-container">
            <div class="table-responsive" style="max-height: 540px;">
                <table class="table table-sm table-bordered table-hover">

                            <th>Sr No</th>
                            <th>Order Number</th>
                            <th>Customer Name</th>
                            <th>AVV</th>
                            <th>Material Type</th>
