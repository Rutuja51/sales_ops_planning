<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Bootstrap Table</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Add this to your CSS -->
</head>

<body>
    <div class="container-fluid mt-3">
        <h2 class="mb-3">Customer Data</h2>
        <div class="table-container">
            <div class="table-responsive" style="max-height: 540px;">
                <table class="table table-sm table-bordered table-hover">
                    <thead class="position-sticky top-0">
                        <tr>
                            <th>Sr No</th>
                            <th>Date</th>
                            <th>Customer Name</th>
                            <th>AVV</th>
                            <th>Material Type</th>
                            <th>Quantity</th>
                            <th>Unit</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Table data will be inserted here by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!--pop up-->
    <!-- Simplified Modal Structure -->
<div class="modal fade" id="itemModal" tabindex="-1">
  <div class="modal-dialog modal-lg" style="max-width: 800px;"> <!-- Increased width -->
    <div class="modal-content" style="min-height: 400px;"> <!-- Increased height -->
      <div class="modal-header bg_primary text-white">
        <h5 class="modal-title" id="modalTitle">Order Details</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      
      <div class="modal-body">
        <div id="modalBody">
          <!-- Content will be inserted here by JavaScript -->
        </div>
      </div>
      
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary bg-navy" id="editBtn">Edit</button>
      </div>
    </div>
  </div>
</div>



    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
