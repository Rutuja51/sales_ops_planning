<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us </title>

    <!-- Bootstrap 5 CSS -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">-->
    <!-- Bootstrap Icons -->
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">-->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js"></script>
    <script src="../js/contact.js"></script>
</head>

<body>
    <!-- Header -->
    <header class="bg-white py-3">
        <div class="container row text-center">
            <span class="fs-4 font-28 font-500 text-light-navy">Get in touch with us</span>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="contact-hero py-5 ">
        <div class="container text-center">
            <h1 class="display-5 fw-bold mb-3">We're Here to Help</h1>
            <p class="fs-5">Have questions about our Order Management System? Reach out to our team for assistance.</p>
        </div>
    </section>

    <!-- Main Content -->
    <div class="container mb-5">
        <div class="row justify-content-center g-4">
            <!-- Contact Information Column -->
            <div class="col-lg-6">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h2 class="card-title text-light-navy mb-4">Contact Information</h2>

                        <!-- Primary Contact Person -->
                        <div class="d-flex mb-4 pb-3 border-bottom" id="primary-contact">
                            <div class="person-avatar me-3">JD</div>
                            <div>
                                <h3 class="h5 text-light-navy mb-1">{{ name }}</h3>
                                <p class="text-muted mb-2">{{ jd }}</p>
                                <div class="d-flex align-items-center mb-1">
                                    <i class="bi bi-telephone text-primary"></i>
                                    <span>{{ country_code }} {{ contact_no }}</span>
                                </div>
                                <div class="d-flex align-items-center">
                                    <i class="primary"></i>
                                    <span>{{ email }}</span>
                                </div>
                            </div>
                        </div>

                        <!-- Business Hours -->
                        <div class="d-flex align-items-center mb-4">
                            <i class="bi bi-clock text-primary me-3 fs-4"></i>
                            <div>
                                <h4 class="h6 mb-0">Business Hours</h4>
                                <p class="text-muted mb-0">Monday - Friday, 8:00 AM - 4:00 PM EST</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Bootstrap JS Bundle with Popper -->
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
