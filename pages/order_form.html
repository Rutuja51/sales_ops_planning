<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Order Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/stylesheet.css">
    <script src="../js/order_form.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Add this to your CSS -->
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-navy sticky-top">
        <div class="container">
            <a class="navbar-brand font-28 text-light">S & Ops <span class="text-white">Planner</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link " id="list_page" href="./order_list.html">Order List</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="planning_page" href="./order_plan.html">Planning</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="order_page" href="./order_form.html">Create Order</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="contact_page" href="./order_contact.html">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!--form-->
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card mb-5">
                    <div class="card-header bg_primary text-white">
                        <h4 class="mb-0">Order Creation Form</h4>
                    </div>
                    <div class="card-body">
                        <form id="orderForm">
                            <!-- Date Field -->
                           <!-- <div class="mb-3">
                                <label for="orderDate" class="form-label required-field">Date</label>
                                <input type="date" class="form-control" id="orderDate" required>
                                <div class="invalid-feedback">Please select a date.</div>
                            </div>-->

                            <!-- Time Slot Field -->
                           <!-- <div class="mb-3">
                                <label for="timeSlot" class="form-label">Time Slot</label>
                                <div class="d-flex flex-wrap" id="timeSlotContainer">
                                    Time slots will be generated by JavaScript 
                                </div>
                                <input type="hidden" id="timeSlot" name="timeSlot">
                            </div>-->

                            <!-- Customer Field and Order Number Field -->
                            <div class="mb-3">
                                <div class="row">
                                    <div class="col-md-6"><label for="customer"
                                            class="form-label required-field">Customer</label>
                                        <input type="text" class="form-control" id="customer" required>
                                        <div class="invalid-feedback">Please enter customer name.</div>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="orderNumber" class="form-label">Order Number</label>
                                        <input type="text" class="form-control" id="orderNumber">
                                    </div>
                                </div>
                            </div>

                            <!-- Quantity and Unit Fields -->
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="quantity" class="form-label required-field">Quantity</label>
                                    <input type="number" class="form-control" id="quantity" min="0" step="0.01"
                                        required>
                                    <div class="invalid-feedback">Please enter a valid quantity.</div>
                                </div>
                                <div class="col-md-6">
                                    <label for="unit" class="form-label required-field">Unit</label>
                                    <select class="form-select" id="unit" required>
                                        <option value="" selected disabled>Select unit</option>
                                        <option value="ton">Ton</option>
                                        <option value="kg">Kilogram (kg)</option>
                                    </select>
                                    <div class="invalid-feedback">Please select a unit.</div>
                                </div>
                            </div>

                            <!-- Material Field -->
                            <div class="mb-3">
                                <label for="materialSelect" class="form-label required-field">Material</label>
                                <select class="form-select mb-2" id="materialSelect">
                                    <option value="" selected disabled>Select material to add</option>
                                    <option value=""><label class="font-14 font-500 font-navy">Output</label></option>
                                    <option value="E-Bike">E-Bike</option>
                                    <option value="Secondary_Mix/Powertools">Secondary Mix/Powertools</option>
                                    <option value="Mobile/Laptop">Mobile/Laptop</option>
                                    <option value="EV_packs(complete)">EV packs(complete)</option>
                                    <option value="EV_Modules(dismantled)">EV Modules(dismantled)</option>
                                    <option value="Home_Storage(Complete)">Home Storage(Complete)</option>
                                    <option value="Home_Storage(dismantled)">Home Storage(dismantled)</option>
                                    <option value="Primary">Primary</option>
                                    <option value=""><label class="font-14 font-500 font-navy">Output</label></option>
                                    <option value="NMC_Black_Mask-Dry">NMC Black Mask-Dry</option>
                                    <option value="NMC_Black_Mask-wet">NMC Black Mask-wet</option>
                                    <option value="Aluminium_Shred">Aluminium Shred</option>
                                    <option value="Steel_Shred">Steel Shred</option>
                                    <option value="Copper">Copper</option>
                                    <option value="Plastic(FH)">Plastic(FH)</option>
                                    <option value="Plastic(SLF)">Plastic(SLF)</option>
                                    <option value="Metal_Mix">Metal Mix</option>
                                    <option value="Metal_Mix">Metal Mix</option>
                                    <option value="NMC_Old_Batteries(Recycling)">NMC Old Batteries(Recycling)</option>
                                    <option value="LFP_Old_Batteries(Recycling)">LFP Old Batteries(Recycling)</option>
                                </select>
                                <button type="button" class="btn btn-sm btn-primary bg_primary" id="addMaterialBtn">Add
                                    Material</button>

                                <div id="materialsContainer" class="mt-3">
                                    <!-- Added materials will appear here -->
                                </div>
                                <div class="invalid-feedback">Please add at least one material.</div>
                            </div>

                            <!-- Form Buttons -->
                            <div class="mt-4 d-flex justify-content-end">
                                <button type="button" class="btn btn-secondary me-3" id="resetBtn">Reset Form</button>
                                <button type="submit" class="btn btn-primary bg_primary" id="createOrderBtn">Create
                                    Order</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!--Footer-->
    <footer class="bg-navy w-100 text-white py-2" style="position: fixed;bottom: 0;">
        <div class="container text-center">
            <p class="mb-0 font-10">&copy; COPYRIGHT 2025 ECOBAT. ALL RIGHTS RESERVED.</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
